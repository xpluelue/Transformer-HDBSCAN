# Commands are intentionally part of the experiment YAML.  This lets
# baseline.sh run a different model implementation without being edited.
commands:
  - name: train
    argv:
      - "{torchrun}"
      - --standalone
      - "--nproc_per_node={nproc_per_node}"
      - scripts/train_transformer_metric.py
      - --config
      - "{config}"
      - --train-dir
      - "{data_dir}"
      - --validation-dir
      - "{data_dir}"
      - --n-jobs
      - "{train_n_jobs}"
      - --batch-size
      - "{batch_size}"
      - --device
      - cuda
      - --log-dir
      - "{run_dir}/logs"
      - --output
      - "{run_dir}/model.pt"
  - name: evaluate
    argv:
      - "{torchrun}"
      - --standalone
      - "--nproc_per_node={nproc_per_node}"
      - scripts/evaluate_transformer_metric.py
      - --config
      - "{config}"
      - --test-dir
      - "{data_dir}"
      - --checkpoint
      - "{run_dir}/model.pt"
      - --n-jobs
      - "{train_n_jobs}"
      - --batch-size
      - "{batch_size}"
      - --device
      - cuda
      - --output
      - "{run_dir}/test.json"
      - --predictions-output
      - "{run_dir}/predictions.npz"

# Parameters for one Transformer-metric baseline experiment.  Add another YAML
# file for a variant, then add "name:configs/your_variant.yaml" to EXPERIMENTS
# in baseline.sh.
train:
  window_length: 1024
  epochs: 10
  batch_size: 256
  hdf5_cache_size: 32
  shuffle_train_windows: true
  learning_rate: 0.0003
  weight_decay: 0.0001
  amp: true
  amp_dtype: bf16
  margin: 0.2
  min_cluster_size: 5
  min_emitters: 2
  early_stopping_patience: 3
  seed: 42

model:
  model_dim: 128
  num_layers: 4
  num_heads: 4
  embedding_dim: 8
  feedforward_dim: 256
  dropout: 0.1

evaluation:
  window_length: 1024
  batch_size: 256
  min_cluster_size: 5
  min_emitters: 2
  seed: 42
